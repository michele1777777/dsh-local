# Terminal surface over the same SessionController and per-session presets as Web.
# No HTTP listener or browser runtime is mounted. CLI flags select only the
# surface; prompt admission, model restoration and compaction remain shared.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- insert:
    - id: tui-startup
      name: '@deepseek-ai/dsh-tui-app/startup'

    # Reads its startup options from the ordinary tuiStartup provider.
    - id: tui-runner
      name: '@deepseek-ai/dsh-tui-app'
      inject: [tuiStartup]
      config:
        task: !!js ctx.tuiStartup.task
        resumeId: !!js ctx.tuiStartup.resumeId
        pick: !!js ctx.tuiStartup.pick
        continueLast: !!js ctx.tuiStartup.continueLast
        all: !!js ctx.tuiStartup.all
        model: !!js ctx.tuiStartup.model
        effort: !!js ctx.tuiStartup.effort
        preset: !!js ctx.tuiStartup.preset

# Carrier-neutral Web business services. No webserver, web-runtime, modules,
# or browser UI is mounted. Calls are in-process, not an alternate LLM client.
- insert:
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'
    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'
    # Same read-only whole-log metrics unit as Web; no second token estimator.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'
    # Background-job roster (`job.list`) for /jobs, /tasks and the status line;
    # the session control stream no longer carries jobs.
    - id: job-controller
      name: '@deepseek-ai/dsh-api-job-controller'
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # Human `/skills`: lists the skills the session's layered skill registry resolves.
    - id: command-skills
      name: '@deepseek-ai/dsh-command-skills'

# Match the Web agent plane exactly. Tools/compaction/skills/planning are
# selected by each Session's recorded preset, never duplicated globally.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

# The preset selection registry; the shipped preset declarations are the Web bundle's
# `presets/*.patch.yml`, listed after this file in package.json `dsh.bundle.patch`.
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

# Available on both surfaces; sessions stay manual until explicitly switched.
- insert:
    - id: smart-approval
      name: '@deepseek-ai/dsh-smart-approval'
      config:
        timeoutMs: 20000
        maxInputChars: 48000
        maxOutputChars: 48000
        maxOutputTokens: 4096
        maxConcurrentReviews: 2
        deniedTools: []
        humanOnlyTools: [run_code]
        # plugin_manager asks for danger-full-access inside every call; Smart reviews that request.
        escalatingTools: [plugin_manager]
