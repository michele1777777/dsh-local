          maxTokensField: max_tokens
          supportsStrictMode: false
          thinkingFormat: deepseek
          requiresReasoningContentOnAssistantMessages: true

        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (local)
            contextWindow: 184320
            maxTokens: 36000
            input:
              - text
              - image
            reasoningEfforts:
              off:
              high: high
              max: max

      ds4-v41-flash-summary:
        displayName: ds4 V4.1 flash summary
        apiKeyEnv: DSH_LOCAL_LLM_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8080/v1
        baseURLEnv: DSH_LOCAL_LLM_URL
        sessionCache: true
        reasoning: off
        streamIdleTimeoutMs: 1800000

        retryPolicy:
          mode: normal
          maxRetries: 3
          retryableCodes:
            - EMPTY_RESPONSE
