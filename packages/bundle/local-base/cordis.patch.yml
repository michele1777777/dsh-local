# Local-first host plane for this distribution, layered right after @deepseek-ai/dsh-base.
#
# Every route below talks to an OpenAI-compatible server on one address. Set DSH_LOCAL_LLM_URL to reach a
# server on another machine (default http://127.0.0.1:8080/v1) and DSH_LOCAL_LLM_API_KEY to any value when
# the server checks no key. One server process serves one model at a time; the summary routes reuse it.
#
# Each conversation route has a summary twin (`*-summary`) with reasoning off and its own output budget,
# so context compaction never spends its output budget thinking.

# Example local routes. A layer that patches this row replaces the whole provider dictionary, so a
# deployment that adds its own routes repeats these entries.
- id: llm-pi-ai
  config:
    providers:

      # Qwen3.8 Flash Next served by TabbyAPI with exllamav3. The thinking switch travels in
      # chat_template_kwargs (TabbyAPI's template_vars), so these routes use the chat-template format. The
      # template's levels are low, medium and xhigh (high renders as xhigh); off sends enable_thinking false.
      # contextWindow must match the server's max_seq_len.
      qwen-flash:
        displayName: qwen38 flash
        apiKeyEnv: DSH_LOCAL_LLM_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8080/v1
        baseURLEnv: DSH_LOCAL_LLM_URL
        sessionCache: true
        reasoning: xhigh
        streamIdleTimeoutMs: 1800000

        # Retry bodyless transport failures before treating them as context overflow.
        retryPolicy:
          mode: normal
          maxRetries: 3
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
            - CONTEXT_WINDOW_EXCEEDED

        compat:
          thinkingFormat: chat-template
          chatTemplateKwargs:
            enable_thinking:
              $var: thinking.enabled
            reasoning_effort:
              $var: thinking.effort
              omitWhenOff: true
          supportsReasoningEffort: true

        models:
          - id: qwen3.8-next-flash
            name: Qwen3.8 Flash Next
            contextWindow: 184320
            # 36000 keeps the compaction trigger at 80% of the window (~147k):
            # 184320 - 36000 > 0.8 x 184320.
            maxTokens: 36000
            input:
              - text
              - image
            reasoningEfforts:
              off:
              low: low
              medium: medium
              xhigh: xhigh

      qwen-flash-summary:
        displayName: qwen38 flash summary
        apiKeyEnv: DSH_LOCAL_LLM_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8080/v1
        baseURLEnv: DSH_LOCAL_LLM_URL
        sessionCache: true
        reasoning: off
        streamIdleTimeoutMs: 1800000

        # Retry bodyless transport failures before treating them as context overflow.
        retryPolicy:
          mode: normal
          maxRetries: 3
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
            - CONTEXT_WINDOW_EXCEEDED

        compat:
          thinkingFormat: chat-template
          chatTemplateKwargs:
            enable_thinking:
              $var: thinking.enabled
            reasoning_effort:
              $var: thinking.effort
              omitWhenOff: true
          supportsReasoningEffort: true

        models:
          - id: qwen3.8-next-flash
            name: Qwen3.8 Flash Next Summary
            contextWindow: 184320
            maxTokens: 32768
            input:
              - text
            reasoningEfforts:
              off:
              low: low
              medium: medium
              xhigh: xhigh

      # Qwen3.8 27B (dense) on the same TabbyAPI + exllamav3 server, in place of Flash Next. Same chat template,
      # thinking levels and managed pruning endpoint as qwen-flash; contextWindow matches the server's max_seq_len.
      qwen-27b:
        displayName: qwen38 27B
        apiKeyEnv: DSH_LOCAL_LLM_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8080/v1
