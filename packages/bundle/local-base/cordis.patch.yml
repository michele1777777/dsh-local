# Host-plane compaction, used where no agent preset composes its own (ACP, headless): summaries go to the
# summary twin of the conversation's route, so a local server never sees an unknown route.
- id: compaction-basic
  config:
    auto: true
    thresholdRatio: 0.80
    headroomTokens: 0
    retainRatio: 0.16
    maxTokens: 32768
    compactionRetries: 1
    maxOverflowRetries: 1
    # Other routes summarize through their own model.
    modelPolicies:
      - provider: qwen-flash
        model: qwen3.8-next-flash
        summarizationProvider: qwen-flash-summary
        summarizationModel: qwen3.8-next-flash
      - provider: qwen-27b
        model: qwen3.8-27b
        summarizationProvider: qwen-27b-summary
        summarizationModel: qwen3.8-27b
      - provider: ds4-v4-flash
        model: deepseek-v4-flash
        summarizationProvider: ds4-v4-flash-summary
        summarizationModel: deepseek-v4-flash
      - provider: ds4-v41-flash
        model: deepseek-v4.1-flash
        summarizationProvider: ds4-v41-flash-summary
        summarizationModel: deepseek-v4.1-flash

# Laya keeps or removes whole tool outputs verbatim; size-based trimming stays off, as in the local preset.
- id: tool-result-pruner
  disabled: true

- insert:
    # Prepared conversations: /prechat seeds a new chat with USER: / ASSISTANT: turns written for one model.
    - id: prechat
      name: '@deepseek-ai/dsh-prechat'
      config:
        routes:
          - provider: ds4-v41-flash
            model: deepseek-v4.1-flash

    # Verbatim pruning decided by a decision service before summary compaction, at the same threshold. DSH_LAYA
    # selects the pass: `resident` uses the service at LAYA_URL (default http://127.0.0.1:8766); `managed`
    # additionally sends the local routes' passes to their model server, which lends the decision worker the memory
    # of its own caches (`/v1/laya/compact`). Any service failure changes nothing, so summary compaction proceeds as
    # before. Without DSH_LAYA the row stays mounted in `projection` mode, so stored sessions with pruning rewrites
    # still resume.
    - id: laya-pruner
      name: '@deepseek-ai/dsh-compaction-laya-pruner'
      config:
        mode: !!js "['resident', 'managed'].includes(process.env.DSH_LAYA ?? '') ? 'pass' : 'projection'"
        url: !!js process.env.LAYA_URL || 'http://127.0.0.1:8766'
        modelEndpoints: !!js >-
          process.env.DSH_LAYA === 'managed'
            ? [['ds4-v41-flash', 'deepseek-v4.1-flash'], ['qwen-flash', 'qwen3.8-next-flash'], ['qwen-27b', 'qwen3.8-27b']].map(([provider, model]) =>
                ({ provider, model, url: `${process.env.DSH_LOCAL_LLM_URL || 'http://127.0.0.1:8080/v1'}/laya/compact` }))
            : []
        thresholdRatio: 0.80
        targetRatio: 0.25
        minBudgetRatio: 0.25
        timeoutMs: 120000

    # Web search providers beside the DeepSeek ones; select one with `searchProvider` on the `web` row.
    - id: web-search-exa
      name: '@deepseek-ai/dsh-web-search-exa'
    - id: web-search-tavily
      name: '@deepseek-ai/dsh-web-search-tavily'
