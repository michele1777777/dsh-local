            - TIMEOUT
            - TRANSPORT
            - CONTEXT_WINDOW_EXCEEDED

        compat:
          thinkingFormat: chat-template
          chatTemplateKwargs:
            enable_thinking:
              $var: thinking.enabled
            reasoning_effort:
              $var: thinking.effort
              omitWhenOff: true
          supportsReasoningEffort: true

        models:
          - id: qwen3.8-27b
            name: Qwen3.8 27B
            contextWindow: 184320
            # 36000 keeps the compaction trigger at 80% of the window (~147k):
            # 184320 - 36000 > 0.8 x 184320.
            maxTokens: 36000
            input:
              - text
              - image
            reasoningEfforts:
              off:
              low: low
              medium: medium
              xhigh: xhigh

      qwen-27b-summary:
        displayName: qwen38 27B summary
        apiKeyEnv: DSH_LOCAL_LLM_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8080/v1
        baseURLEnv: DSH_LOCAL_LLM_URL
        sessionCache: true
        reasoning: off
        streamIdleTimeoutMs: 1800000

        # Retry bodyless transport failures before treating them as context overflow.
        retryPolicy:
          mode: normal
          maxRetries: 3
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
            - CONTEXT_WINDOW_EXCEEDED

        compat:
          thinkingFormat: chat-template
          chatTemplateKwargs:
            enable_thinking:
              $var: thinking.enabled
            reasoning_effort:
              $var: thinking.effort
              omitWhenOff: true
          supportsReasoningEffort: true

        models:
          - id: qwen3.8-27b
            name: Qwen3.8 27B Summary
            contextWindow: 184320
            maxTokens: 32768
            input:
              - text
            reasoningEfforts:
              off:
              low: low
              medium: medium
              xhigh: xhigh

      # DeepSeek V4 Flash and V4.1 Flash served by a ds4 server. The GGUF loaded at startup selects
      # the model; both ids are accepted aliases. Thinking uses the deepseek format: off sends a disabled
      # thinking object, low and medium render as high, and max selects Think Max (normal thinking when the
      # context is too small). contextWindow must match the server's --ctx.
      ds4-v4-flash:
        displayName: ds4 V4 flash
        apiKeyEnv: DSH_LOCAL_LLM_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8080/v1
        baseURLEnv: DSH_LOCAL_LLM_URL
        sessionCache: true
        reasoning: high
        streamIdleTimeoutMs: 1800000

        retryPolicy:
          mode: normal
          maxRetries: 3
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT

        compat:
          supportsStore: false
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          supportsUsageInStreaming: true
          maxTokensField: max_tokens
          supportsStrictMode: false
          thinkingFormat: deepseek
          requiresReasoningContentOnAssistantMessages: true

        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash (local)
            contextWindow: 184320
            # 36000 keeps the compaction trigger at 80% of the window (~147k), as for Qwen3.8 Flash Next.
            maxTokens: 36000
            input:
              - text
            reasoningEfforts:
              off:
              high: high
              max: max

      ds4-v4-flash-summary:
        displayName: ds4 V4 flash summary
        apiKeyEnv: DSH_LOCAL_LLM_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8080/v1
        baseURLEnv: DSH_LOCAL_LLM_URL
        sessionCache: true
        reasoning: off
        streamIdleTimeoutMs: 1800000

        retryPolicy:
          mode: normal
          maxRetries: 3
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT

        compat:
          supportsStore: false
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          supportsUsageInStreaming: true
          maxTokensField: max_tokens
          supportsStrictMode: false
          thinkingFormat: deepseek
          requiresReasoningContentOnAssistantMessages: true

        models:
